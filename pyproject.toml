[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aoas-code"
version = "0.1.0"
description = "Public fitting and figure code for the AoAS activity-prediction paper"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = [
    "matplotlib>=3.7",
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.optional-dependencies]
hbg = ["arviz>=0.16", "cmdstanpy>=1.1"]
unseen = ["cvxopt>=1.3"]
test = ["pytest>=7.4"]

[tool.setuptools.package-data]
"activity_prediction.models" = ["stan/*.stan"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
